architectures=esp32
depends=ArduinoJson, IoAbstraction, TaskManagerIO, audio-tools, Adafruit NeoPixel, Adafruit LED Backpack Library, Adafruit LIS3DH, Adafruit BusIO, Adafruit PN532, ADS1115_WE, PCA9685, ESP32Servo, RotaryDial, M5Unified
includes=ESP32EscapeRoom.h
