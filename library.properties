sentence=Engine for ESP32 escape room puzzles: FSM, multi-puzzle, HA/MQTT.
paragraph=Hardware-abstracted engine for building ESP32 escape room puzzles: a synchronous puzzle state machine, multi-puzzle orchestration with game levels, MP3 playback over I2S with the Helix decoder, PCF8574/PCF8575 I/O expanders via IoAbstraction, HT16K33 14-segment display, NeoPixel strips with per-puzzle ranges, servo, LIS3DH accelerometer, ADS1115 ADC, PCA9685 PWM, PN532 NFC, phone rotary dial, native rotary encoder, and JSON configuration via SD/LittleFS with an AP-mode captive portal. Board pin mapping is selected automatically for the Seeed XIAO ESP32-S3/C3, M5Stack Cardputer, M5Stack StampPLC, Adafruit MatrixPortal S3, Ai-Thinker ESP32-A1S Audio Kit and YD-ESP32-S3.
category=Device Control
